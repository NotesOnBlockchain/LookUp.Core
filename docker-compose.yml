services:
  lookup-core:
    image: ghcr.io/adampetho/lookup-core:latest
    container_name: lookup-core
    restart: unless-stopped
    # Not exposed to the host — internal only
    # Reachable by lookup-website as http://lookup-core:37127
    expose:
      - "37127"
    volumes:
      - /home/lookup/.lookup/backend:/home/lookup/.lookup/backend
    extra_hosts:
      # Allows Config.json Bitcoin RPC URIs pointing to localhost to reach the host machine
      - "host.docker.internal:host-gateway"
    networks:
      - lookup-internal

  lookup-website:
    image: ghcr.io/adampetho/lookup-website:latest
    container_name: lookup-website
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - /home/lookup/.lookup/website:/home/lookup/.lookup/website
    depends_on:
      - lookup-core
    networks:
      - lookup-internal

networks:
  lookup-internal:
    driver: bridge
