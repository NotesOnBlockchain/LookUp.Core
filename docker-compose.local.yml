services:
  lookup-core:
    build:
      context: .
      dockerfile: Dockerfile.core
    image: lookup-core:test
    container_name: lookup-core
    restart: unless-stopped

    # Reachable by lookup-website as http://lookup-core:37127
    expose:
      - "37127"
    
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:37127/health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
      
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    
    volumes:
      - ./test-data/backend:/home/lookup/.lookup/backend

    extra_hosts:
      # Allows Config.json Bitcoin RPC URIs pointing to localhost to reach the host machine
      - "host.docker.internal:host-gateway"

    networks:
      - lookup-internal
      
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp


  lookup-website:
    build:
      context: .
      dockerfile: Dockerfile.blazor
    image: lookup-website:test
    container_name: lookup-website
    restart: unless-stopped

    ports:
      - "5000:5000"

    volumes:
      - ./test-data/Website:/home/lookup/.lookup/website

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    depends_on:
      lookup-core:
        condition: service_healthy

    networks:
      - lookup-internal
      
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp


networks:
  lookup-internal:
    driver: bridge